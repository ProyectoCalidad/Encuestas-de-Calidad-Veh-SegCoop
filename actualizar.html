<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar panel Segurcoop</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style/dist/xlsx.bundle.js"></script>
<style>
  :root{
    --rojo:#E5322C; --fondo:#f4f5f7; --texto:#222; --card:#fff; --borde:#e2e4e8;
  }
  *{box-sizing:border-box;}
  body{
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--fondo); color:var(--texto); margin:0; padding:40px 20px;
    display:flex; justify-content:center;
  }
  .card{
    background:var(--card); border:1px solid var(--borde); border-radius:14px;
    padding:36px; max-width:640px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,.06);
  }
  h1{font-size:1.4rem; margin:0 0 6px;}
  p{color:#555; line-height:1.5;}
  .drop{
    border:2px dashed var(--rojo); border-radius:12px; padding:36px 20px; text-align:center;
    margin:24px 0; cursor:pointer; transition:.15s;
  }
  .drop.hover{background:#fdeceb;}
  .drop input{display:none;}
  button{
    background:var(--rojo); color:#fff; border:none; padding:12px 22px; border-radius:8px;
    font-size:1rem; cursor:pointer; width:100%;
  }
  button:disabled{background:#c9c9c9; cursor:not-allowed;}
  #estado{margin-top:16px; font-size:.95rem; white-space:pre-line;}
  .ok{color:#1C9A5D; font-weight:600;}
  .err{color:#c0392b; font-weight:600;}
  a.descarga{
    display:inline-block; margin-top:14px; background:#1C9A5D; color:#fff;
    padding:12px 22px; border-radius:8px; text-decoration:none; font-weight:600;
  }
  code{background:#eee; padding:2px 6px; border-radius:4px;}
</style>
</head>
<body>
<div class="card">
  <h1>Actualizar panel de Segurcoop</h1>
  <p>Subí acá el Excel de la BBDD mensual (hoja <code>Acumulado</code>). Esta página arma el archivo
     <code>data.json</code> que necesita el panel — todo pasa en tu navegador, no se sube nada a ningún servidor.</p>

  <div class="drop" id="drop">
    <p style="margin:0 0 8px;"><strong>Arrastrá el Excel acá</strong> o hacé clic para elegirlo</p>
    <input type="file" id="file" accept=".xlsx,.xls">
  </div>

  <div id="estado"></div>
</div>

<script>
const drop = document.getElementById('drop');
const input = document.getElementById('file');
const estado = document.getElementById('estado');

drop.addEventListener('click', () => input.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault();
  drop.classList.remove('hover');
  if (e.dataTransfer.files.length) procesar(e.dataTransfer.files[0]);
});
input.addEventListener('change', () => { if (input.files.length) procesar(input.files[0]); });

function aPuntaje(v) {
  if (v === null || v === undefined || v === '') return null;
  const s = String(v).trim();
  return /^[1-5]$/.test(s) ? parseInt(s, 10) : null;
}

function aMes(valorFecha) {
  let d;
  if (valorFecha instanceof Date) d = valorFecha;
  else if (typeof valorFecha === 'number') d = XLSX.SSF.parse_date_code(valorFecha);
  if (!d) return null;
  const y = d.y ?? d.getFullYear();
  const m = (d.m ?? (d.getMonth() + 1));
  return `${y}-${String(m).padStart(2, '0')}`;
}

function limpio(v) {
  if (v === null || v === undefined) return null;
  const s = String(v).trim();
  return s === '' ? null : s;
}

function aFechaDDMMYYYY(v) {
  let d = null;
  if (v instanceof Date) d = v;
  else if (typeof v === 'number') { const p = XLSX.SSF.parse_date_code(v); if (p) d = new Date(p.y, p.m - 1, p.d); }
  if (!d || isNaN(d.getTime())) return '';
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function aRecomendacion(v) {
  if (v === null || v === undefined || v === '') return '';
  const n = Number(v);
  if (n === 1) return 'Promotor';
  if (n === 2) return 'Detractor';
  return '';
}

function construirDetalle(filas) {
  return filas.map(f => ({
    'Orden de Servicio': limpio(f['IdOrdenDeServicio']) ?? '',
    'N° de Póliza': limpio(f['NroPoliza']) ?? '',
    'Asegurado': limpio(f['Asegurado']) ?? '',
    'Patente': limpio(f['Patente']) ?? '',
    'Fecha de Servicio': aFechaDDMMYYYY(f['FechaDeServicioPrestado']),
    'Fecha de Encuesta': aFechaDDMMYYYY(f['FechaDeEncuesta']),
    'Estado de Encuesta': normalizar(RESPONDIO_MAP, limpio(f['RESPONDIO?'])) ?? '',
    'Atención': aPuntaje(f['ATENCION']) ?? '',
    'Demora': aPuntaje(f['DEMORA']) ?? '',
    'Prestador': aPuntaje(f['PRESTADOR']) ?? '',
    'Recomendación': aRecomendacion(f['RECOMENDAS?']),
  }));
}

const ESTILO_ENCABEZADO = {
  fill: { patternType: 'solid', fgColor: { rgb: '0E3866' } },
  font: { color: { rgb: 'FFFFFF' }, bold: true, name: 'Calibri', sz: 11 },
};
const ANCHOS_DETALLE = [16, 16, 26, 12, 15, 15, 20, 10, 10, 10, 14];

function descargarDetalleXlsx(detalle) {
  const hoja = XLSX.utils.json_to_sheet(detalle);
  const encabezados = Object.keys(detalle[0] || {});
  encabezados.forEach((_, i) => {
    const celda = XLSX.utils.encode_cell({ r: 0, c: i });
    if (hoja[celda]) hoja[celda].s = ESTILO_ENCABEZADO;
  });
  hoja['!cols'] = ANCHOS_DETALLE.map(w => ({ wch: w }));
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Detalle');
  const buffer = XLSX.write(libro, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  return URL.createObjectURL(blob);
}

const RESPONDIO_MAP = {
  'RESPONDIÓ':'Encuesta Completa', 'RESPONDIO':'Encuesta Completa', 'ENCUESTA COMPLETA':'Encuesta Completa',
  'PARCIAL':'Encuesta Parcial', 'ENCUESTA PARCIAL':'Encuesta Parcial',
  'NO RESPONDIÓ':'Encuesta No Respondida', 'NO RESPONDIO':'Encuesta No Respondida', 'ENCUESTA NO RESPONDIDA':'Encuesta No Respondida',
};
// "Neutral" ya no se usa: la pregunta de recomendación es binaria. Si no la
// contestó, queda sin clasificar (null), no se fuerza a "Neutral".
const RECOMIENDA_MAP = { 'RECOMIENDA':'Recomienda', 'NO RECOMIENDA':'No Recomienda', 'NEUTRAL': null };

function normalizar(mapa, valorCrudo) {
  if (valorCrudo === null || valorCrudo === undefined) return null;
  const clave = String(valorCrudo).trim().toUpperCase();
  return (clave in mapa) ? mapa[clave] : valorCrudo;
}

function procesar(archivo) {
  estado.innerHTML = 'Procesando…';
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
      const nombreHoja = wb.SheetNames.includes('Acumulado') ? 'Acumulado' : wb.SheetNames[0];
      const hoja = wb.Sheets[nombreHoja];
      const filas = XLSX.utils.sheet_to_json(hoja, { defval: null, raw: true });

      const casos = filas.map(f => {
        const mesRaw = f['Mes'] ?? f['Mes '];
        return {
          mes: mesRaw instanceof Date ? `${mesRaw.getFullYear()}-${String(mesRaw.getMonth()+1).padStart(2,'0')}` : aMes(mesRaw),
          provincia: limpio(f['Provincia']),
          vehiculo: limpio(f['Tipo de Vehículo']),
          servicio: limpio(f['Servicio']),
          problema: limpio(f['Problema']),
          atencion: aPuntaje(f['ATENCION']),
          demora: aPuntaje(f['DEMORA']),
          prestador: aPuntaje(f['PRESTADOR']),
          recomienda: normalizar(RECOMIENDA_MAP, limpio(f['Recomienda Ok'])),
          respondio: normalizar(RESPONDIO_MAP, limpio(f['RESPONDIO?'])),
        };
      }).filter(c => c.mes); // descarta filas totalmente vacías

      const meses = [...new Set(casos.map(c => c.mes))].sort();

      const data = {
        generadoEl: new Date().toLocaleString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires' }),
        meses,
        casos,
      };

      const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const detalle = construirDetalle(filas);
      const urlDetalle = descargarDetalleXlsx(detalle);

      const urlStandalone = generarPanelStandalone(data);

      estado.innerHTML =
        `<span class="ok">Listo ✔</span><br>${casos.length} casos procesados · meses: ${meses.join(', ')}<br>` +
        `<a class="descarga" href="${url}" download="data.json">Descargar data.json</a>` +
        `<p style="margin-top:14px;">Reemplazá el archivo <code>data.json</code> del repositorio por este y subilo a GitHub (Add file → Upload files → Commit).</p>` +
        `<a class="descarga" style="background:#005A96;" href="${urlDetalle}" download="Detalle-Segurcoop.xlsx">Descargar Detalle.xlsx (para el cliente)</a>` +
        `<p style="margin-top:14px;">Este es el reporte con el detalle de cada caso (incluye Asegurado y Patente) para mandarle a Segurcoop — no se sube a GitHub, es solo para vos.</p>` +
        `<a class="descarga" style="background:#3D3678;" href="${urlStandalone}" download="Panel-Segurcoop-completo.html">Descargar Panel-Segurcoop-completo.html</a>` +
        `<p style="margin-top:14px;">Un solo archivo con el panel entero y los datos ya adentro — se abre con doble clic, sin depender de GitHub ni de internet. Ideal para guardar en una carpeta compartida.</p>`;
    } catch (err) {
      estado.innerHTML = `<span class="err">Hubo un error procesando el archivo.</span><br>${err.message}`;
    }
  };
  reader.readAsArrayBuffer(archivo);
}

function decodificarB64Utf8(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function generarPanelStandalone(data) {
  let html = decodificarB64Utf8(PLANTILLA_PANEL_B64);
  html = html.replace('src="assets/logo-segurcoop.png"', `src="data:image/png;base64,${LOGO_SEGURCOOP_B64}"`);
  html = html.replace('src="assets/logo-cardinal.png"', `src="data:image/png;base64,${LOGO_CARDINAL_B64}"`);
  const scriptDatos = `<script>window.__DATOS_SEGURCOOP__ = ${JSON.stringify(data)};<\/script>`;
  html = html.replace('</head>', scriptDatos + '</head>');
  const blob = new Blob([html], { type: 'text/html' });
  return URL.createObjectURL(blob);
}
